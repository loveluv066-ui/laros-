<style>
/* Concept: a night-sea blue notebook. One big double ring (blue = today, cream = week) over a day split into prayer-time sections. */
:root{
  --bg:#EDF1F5; --card:#FBF8F2; --card2:#E4EBF1; --fg:#193347; --mute:#4F6478; --line:#CBD6E0;
  --ring-day:#334B60; --ring-week:#D2BC8A; --track:#D8E1E9; --accent:#B46A72; --blush:#F7C8D3; --on-accent:#FFF7E6; --ok:#4E7D6B; --water:#4F7FA3;
  --font-display:"Aref Ruqaa","Amiri","Noto Naskh Arabic",serif; --font-body:"Tajawal","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061C2C; --card:#193347; --card2:#102A3D; --fg:#F4EFE4; --mute:#A9B8C7; --line:#334B60;
  --ring-day:#B7C7D6; --ring-week:#F1E4C6; --track:#26405A; --accent:#F7C8D3; --blush:#F7C8D3; --on-accent:#061C2C; --ok:#9CC5AE; --water:#8DB6D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061C2C; --card:#193347; --card2:#102A3D; --fg:#F4EFE4; --mute:#A9B8C7; --line:#334B60;
  --ring-day:#B7C7D6; --ring-week:#F1E4C6; --track:#26405A; --accent:#F7C8D3; --blush:#F7C8D3; --on-accent:#061C2C; --ok:#9CC5AE; --water:#8DB6D6; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:560px;margin:0 auto}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.top h1{margin:0;font-family:var(--font-body);font-size:28px;line-height:1;flex:1;font-weight:700;letter-spacing:.02em}
.top h1.brand{font-family:var(--font-display)}
.top h1 small{display:block;font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:4px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.tabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:999px;margin:6px 0 14px}
.tabs button{flex:1;padding:8px 6px;border-radius:999px;color:var(--mute);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.ringwrap{position:relative;width:176px;height:176px;flex:none}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringwrap .c b{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.ringwrap .c span{font-size:12px;color:var(--mute)}
.legend{display:grid;gap:10px;min-width:0;flex:1 1 140px}
.legend div{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pill{padding:13px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;direction:ltr;text-align:center}
.pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pill small{display:block;font-weight:400;font-size:12px;direction:rtl;opacity:.85}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}
.sec>header{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 4px}
.sec>header h2{margin:0;font-size:17px;font-weight:700}
.sec>header span{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:48px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--mute);font-size:12.5px}
.row.now{background:var(--track)}
.row.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--ring-day);flex:none;display:grid;place-items:center;color:var(--on-accent);background:transparent}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.btn{padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.late{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.qrow{padding:10px 16px 14px;border-top:1px solid var(--line)}
.qrow .qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.qrow output{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);direction:ltr}
input,textarea,select{direction:rtl;text-align:right}
input[type=number],input[type=text],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.stack{display:grid;gap:8px;padding:10px 16px 14px}
.stack .two{display:grid;grid-template-columns:1fr auto;gap:8px}
.muted{color:var(--mute);font-size:13.5px}
.note{margin:14px 0;padding:12px 14px;border-radius:14px;background:var(--card2);color:var(--mute);font-size:13.5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.wd{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--mute);padding:8px 0;border-radius:12px}
.wd.today{background:var(--card);border:1px solid var(--line);color:var(--fg)}
.wd svg{width:38px;height:38px;transform:rotate(-90deg)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.tier{border-radius:16px;padding:14px;background:var(--card);border:1px solid var(--line);margin:10px 0}
.scrim{position:fixed;inset:0;background:rgba(3,14,24,.55);z-index:40}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(300px,84vw);background:var(--card);z-index:50;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 24px;padding-right:max(18px,env(safe-area-inset-right,0px));overflow:auto;border-left:1px solid var(--line)}
.drawer h2{font-family:var(--font-display);font-size:26px;margin:0 0 12px}
.drawer button.m{display:block;width:100%;text-align:start;padding:12px 10px;border-radius:12px;font-weight:500}
.drawer button.m:hover{background:var(--card2)}
.drawer .live{color:var(--ok);font-size:12px;margin-inline-start:6px}
.chat{display:grid;gap:8px;margin:10px 0}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{justify-self:start;background:var(--card2)}
.msg.a{justify-self:end;background:var(--card);border:1px solid var(--line)}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry small{display:block;color:var(--mute);margin-bottom:4px}
.form{display:flex;gap:8px;align-items:flex-end}
.form>*{min-width:0}
.water{padding:4px 16px 16px;text-align:center}
.wtitle{font-family:var(--font-display);font-size:26px;color:var(--water);line-height:1.1}
.wstem{width:2px;height:14px;background:var(--water);opacity:.55;margin:2px auto 0}
.wrow{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.wrow::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:2px;background:var(--water);opacity:.55}
.wb{display:grid;justify-items:center;padding-top:12px;position:relative}
.wb::before{content:"";position:absolute;top:0;width:2px;height:12px;background:var(--water);opacity:.55}
.wc{width:62px;height:62px;border-radius:50%;border:2.5px solid var(--water);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--water);background:var(--card);direction:ltr;transition:background .2s}
.wc.on{background:var(--water);color:var(--card)}
.dmonth{color:var(--mute);font-size:13px;margin:16px 4px 0}
.dcard{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0}
.dh{display:flex;align-items:flex-end;gap:8px;margin-bottom:8px;color:var(--mute);font-size:14px}
.dnum{font-size:30px;font-weight:700;line-height:1;color:var(--fg);border-bottom:4px solid var(--ring-day);padding-bottom:2px}
.dt{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.dp{color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.etitle{font-size:20px;font-weight:700;background:transparent!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;padding:10px 2px!important}
.ebody{min-height:52vh;background:transparent!important;border:0!important;padding:12px 2px!important;line-height:1.9;font-size:17px;resize:none}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:10px;transition:opacity .6s}
.splash.off{opacity:0;pointer-events:none}
.splash h1{font-family:var(--font-display);font-size:40px;margin:0}
h3{margin:18px 0 6px;font-size:16px}
label.f{display:grid;gap:4px;margin:10px 0;font-size:14px;color:var(--mute)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}
.bignum{font-size:64px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent);margin:10px 0}
.bigbtn{width:170px;height:170px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:22px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bigbtn:active{transform:scale(.97)}
.hadith{font-size:19px;line-height:2;margin-top:8px;overflow-wrap:anywhere}
.pbar{height:10px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--ring-day);border-radius:999px}
button:disabled{opacity:.45;cursor:default}
</style></head><body>

<div id="app"></div>
<div id="splash" class="splash" role="presentation">
  <svg width="170" height="170" viewBox="0 0 170 170" aria-hidden="true">

    <circle cx="85" cy="85" r="64" fill="none" stroke="var(--ring-day)" stroke-width="6" stroke-linecap="round" stroke-dasharray="250 600"/>
    <g transform="translate(85 85)" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round">
      <path d="M0-4c5-2 9 2 7 7-2 5-9 6-13 1-4-5-1-13 6-14 8-1 15 6 13 15-2 9-12 14-20 10"/>
      <path d="M-18 14c-9-6-10-20-2-27 8-8 22-6 28 3" opacity=".7"/>

  </svg>
  <h1>La Rose</h1>
</div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
var DAYNAMES=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var SUBJ=['جبر','ميكانيك هندسي 1','مقاومة','مساحة','ميكانيك موائع','جيولوجيا','إنجليزي مهندسين'];
var PNAMES={fajr:'الفجر',dhuhr:'الظهر',asr:'العصر',maghrib:'المغرب',isha:'العشاء'};
var LAT=33.5138,LNG=36.2765,TZ=3;

/* ---------- state ---------- */
var S={days:{},tasks:[],diary:[],chat:[],theme:'auto',rest:false,reward100:'',reward75:'',cname:'رفيقتي',az:{names:[],m:{}},had:{used:[],notes:{}},char:[],q:{mem:{},notes:{},rev:{},drawn:[]},log:[],tl:{books:{},open:{},used:[],draw:null,sessions:[],rest:{},days:[5,0]},food:{lists:{b:[],s:[],d:[]},used:{b:[],s:[],d:[]},w:{}},glow:{done:{},photo:'',photoK:''},per:{h:'',cyc:[],len:28}};
var loaded=false,ref=null,saveT=null,view='today',drawer=false,sampleFn=null,dict=null;

function dnow(){return new Date(Date.now()+TZ*3600e3)}
function keyOf(d){return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function day(k){
  var d=S.days[k];if(!d||typeof d!=='object')d=S.days[k]={};
  if(!d.done||typeof d.done!=='object')d.done={};
  if(!d.prayer||typeof d.prayer!=='object')d.prayer={};
  d.qiyam=+d.qiyam||0;d.walk=+d.walk||0;d.water=+d.water||0;
  if(d.wake===undefined)d.wake=null;if(d.sleep===undefined)d.sleep=null;
  return d}
function norm(){
  if(!S.days||typeof S.days!=='object')S.days={};
  Object.keys(S.days).forEach(day);
  ['tasks','diary','chat'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
  S.diary.forEach(function(e,i){if(!e.id)e.id=e.t||Date.now()+i;if(e.title==null)e.title=''});
  if(!S.az||typeof S.az!=='object')S.az={};if(!Array.isArray(S.az.names))S.az.names=[];if(!S.az.m||typeof S.az.m!=='object')S.az.m={};
  if(!S.had||typeof S.had!=='object')S.had={};if(!Array.isArray(S.had.used))S.had.used=[];if(!S.had.notes||typeof S.had.notes!=='object')S.had.notes={};
  if(!Array.isArray(S.char))S.char=[];if(!Array.isArray(S.log))S.log=[];
  if(!S.tl||typeof S.tl!=='object')S.tl={};var T=S.tl;if(!T.books||typeof T.books!=='object')T.books={};if(!T.open||typeof T.open!=='object')T.open={};if(!T.rest||typeof T.rest!=='object')T.rest={};if(!Array.isArray(T.used))T.used=[];if(!Array.isArray(T.sessions))T.sessions=[];if(!Array.isArray(T.days))T.days=[5,0];
  if(!S.food||typeof S.food!=='object')S.food={};var F=S.food;if(!F.lists||typeof F.lists!=='object')F.lists={};if(!F.used||typeof F.used!=='object')F.used={};if(!F.w||typeof F.w!=='object')F.w={};['b','s','d'].forEach(function(c){if(!Array.isArray(F.lists[c]))F.lists[c]=[];if(!Array.isArray(F.used[c]))F.used[c]=[]});
  if(!S.glow||typeof S.glow!=='object')S.glow={};var G=S.glow;if(!G.done||typeof G.done!=='object')G.done={};var GD=glowDefaults();if(!Array.isArray(G.goals)){G.goals=GD.goals;G.done={}}if(!G.daily||typeof G.daily!=='object')G.daily=GD.daily;if(!Array.isArray(G.week)||G.week.length!==7)G.week=GD.week;if(!Array.isArray(G.monthly))G.monthly=[];
  if(!S.per||typeof S.per!=='object')S.per={};var PR=S.per;if(!Array.isArray(PR.cyc))PR.cyc=[];if(typeof PR.h!=='string')PR.h='';if(!PR.len)PR.len=28;
  if(!S.q||typeof S.q!=='object')S.q={};['mem','notes','rev'].forEach(function(k){if(!S.q[k]||typeof S.q[k]!=='object')S.q[k]={}});if(!Array.isArray(S.q.drawn))S.q.drawn=[];
}
function save(){
  try{localStorage.setItem('larose',JSON.stringify(S))}catch(e){}
  if(!loaded||!ref)return;
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    var keys=Object.keys(S.days).sort();while(keys.length>90)delete S.days[keys.shift()];
    S.diary=S.diary.slice(0,300);S.chat=S.chat.slice(-40);
    ref.set(JSON.parse(JSON.stringify(S))).catch(function(){});
  },700);
}

/* ---------- prayer times (Damascus, approximate) ---------- */
function rad(d){return d*Math.PI/180}function deg(r){return r*180/Math.PI}
function fixA(a){a=a%360;return a<0?a+360:a}function fixH(h){h=h%24;return h<0?h+24:h}
function julian(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function ptimes(y,m,d){
  var jd=julian(y,m,d)-LNG/360+0.5,D=jd-2451545;
  var g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D);
  var L=fixA(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)));
  var e=23.439-0.00000036*D;
  var RA=fixH(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15);
  var decl=deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L))));
  var mid=fixH(12-(q/15-RA));
  function z(a){return deg(Math.acos((-Math.sin(rad(a))-Math.sin(rad(LAT))*Math.sin(rad(decl)))/(Math.cos(rad(LAT))*Math.cos(rad(decl)))))/15}
  var asrA=-deg(Math.atan(1/(1+Math.tan(rad(Math.abs(LAT-decl))))));
  var adj=TZ-LNG/15;
  function ms(h){return Date.UTC(y,m-1,d)+(h+adj-TZ)*3600e3}
  return {fajr:ms(mid-z(18)),sunrise:ms(mid-z(0.833)),dhuhr:ms(mid+1/60),asr:ms(mid+z(asrA)),maghrib:ms(mid+z(0.833)),isha:ms(mid+z(17))};
}
function fmt(ms){var d=new Date(ms+TZ*3600e3);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}
function timesFor(dt){return ptimes(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate())}

/* ---------- habits ---------- */
function habitsFor(dow,key){
  var rest=S.rest,P=function(k){return rest?null:{id:'p_'+k,type:'prayer',key:k,label:'صلاة '+PNAMES[k]}};
  var wake=[{id:'azkar_wake',label:'أذكار الاستيقاظ'},{id:'qiyam',type:'qiyam',label:'قيام الليل'},{id:'study',label:'ساعة دراسة',sub:'مادة اليوم: '+SUBJ[dow]}];
  if(dow===0)wake.push({id:'talab',go:'talab',label:'رحلة طلب العلم',sub:'بعد ساعة الدراسة'});
  var dhuhr=[P('dhuhr'),(S.food&&S.food.w[weekStartOf(key||keyOf(dnow()))]||{}).s?{id:'salad',label:'سلطة: '+S.food.w[weekStartOf(key||keyOf(dnow()))].s,sub:'من قرعة الأسبوع'}:null,dow===5?{id:'talab',go:'talab',label:'رحلة طلب العلم',sub:'الجمعة عند الظهر'}:null];
  var FW=S.food&&S.food.w[weekStartOf(key||keyOf(dnow()))]||{};
  var secs=[

var busy=false,ctl=null;

function newEntry(){cur={id:Date.now(),t:Date.now(),title:'',text:''};nav('entry')}

  var list=S.diary.slice().sort(function(a,b){return b.t-a.t}),last=null;
  list.forEach(function(e){

  });

  wrap.append(h('div',{style:'height:90px'}));

function micButton(ta){
  var on=false,btn=h('button',{class:'btn ghost',type:'button','aria-label':'كتابة بالصوت'},'🎙 صوت');
  function setOn(v){on=v;btn.textContent=v?'⏹ إيقاف':'🎙 صوت'}
  function add(txt){ta.value=(ta.value&&!/\s$/.test(ta.value)?ta.value+' ':ta.value)+txt;ta.dispatchEvent(new Event('input'))}
  if(dict){
    dict.onFinal(function(r){add(r.text)});dict.onState(function(s){if(s.state==='idle')setOn(false)});
    btn.addEventListener('click',function(){if(on){dict.stop();return}dict.start().then(function(){setOn(true)}).catch(function(){})});
    return btn}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  var rec=null;
  btn.addEventListener('click',function(){
    if(on&&rec){rec.stop();return}
    try{rec=new SR();rec.lang='ar-SY';rec.continuous=true;rec.interimResults=false;
      rec.onresult=function(ev){for(var i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal)add(ev.results[i][0].transcript.trim())};
      rec.onend=function(){setOn(false)};rec.onerror=function(){setOn(false)};rec.start();setOn(true)}catch(e){setOn(false)}});
  return btn;
}

        ta.value=r.text.trim();ta.dispatchEvent(new Event('input'));
        if(!undo){undo=h('button',{class:'btn ghost',type:'button',onclick:function(){ta.value=before;ta.dispatchEvent(new Event('input'));undo.remove();undo=null}},'تراجع');bar.append(undo)}
      }).catch(function(){tidy.textContent='تعذّر الترتيب'}).then(function(){tidy.disabled=false;if(tidy.textContent==='…')tidy.textContent='رتّبي النص'});
    });
    bar.append(tidy);
  }
  var del=h('button',{class:'btn ghost',type:'button',style:'margin-inline-start:auto'},'حذف');
  del.addEventListener('click',function(){
    if(!del.dataset.s){del.dataset.s='1';del.textContent='اضغطي مرة أخرى للحذف';return}
    var i=S.diary.indexOf(e);if(i>=0)S.diary.splice(i,1);cur=null;save();goBack()});
  bar.append(del);
  wrap.append(h('div',{class:'muted',style:'margin:6px 2px'},when),ti,ta,bar);

function context(){
  var t=dnow(),d=day(keyOf(t)),n=0,tot=0;
  habitsFor(t.getUTCDay()).forEach(function(s){s.items.forEach(function(it){if(it.type==='prayer'){tot++;if(d.prayer[it.key]!=null)n++}})});
  return 'تقدم اليوم '+pctOf(t)+'% ، تقدم الأسبوع '+weekPct()+'% ، قيام الليل اليوم '+(d.qiyam||0)+' آية ، الصلوات المسجلة '+n+' من '+tot+'.';
}
function companion(){
  var box=h('section',{class:'sec',style:'padding-bottom:12px'});
  box.append(h('header',null,h('h2',null,S.cname),h('span',null,'رفيقة للمحادثة')));
  var list=h('div',{class:'chat',style:'padding:0 12px',id:'chat','aria-live':'polite'});
  S.chat.slice(-12).forEach(function(m){list.append(h('div',{class:'msg '+(m.role==='user'?'u':'a')},m.content))});
  if(!S.chat.length)list.append(h('div',{class:'muted'},'أنا هنا. احكي لي كيف كان يومك، أو ما يثقل عليك.'));
  box.append(list);
  if(!sampleFn){box.append(h('div',{class:'muted',style:'padding:0 16px'},'المحادثة غير متاحة في هذا العرض.'));return box}
  var inp=h('textarea',{id:'cin',style:'min-height:56px',placeholder:'اكتبي لرفيقتك…','aria-label':'رسالتك'});
  var send=h('button',{class:'btn',id:'csend'},'إرسال'),stop=h('button',{class:'btn ghost',hidden:true},'إيقاف');
  stop.addEventListener('click',function(){if(ctl)ctl.abort()});
  send.addEventListener('click',function(){
    var v=inp.value.trim();if(!v||busy)return;
    busy=true;send.disabled=true;stop.hidden=false;inp.value='';
    S.chat.push({role:'user',content:v});
    list.append(h('div',{class:'msg u'},v));
    var bub=h('div',{class:'msg a'},'…');list.append(bub);
    var rules='أنتِ رفيقة لطيفة اسمك '+S.cname+' داخل مفكرة طالبة هندسة مدنية مسلمة في دمشق تتابع عاداتها. تحدثي بالعربية البسيطة الدافئة وبجمل قصيرة (من جملتين إلى أربع غالباً). ابدئي بالطبطبة على شعورها، ثم اقترحي خطوة صغيرة واقعية إن ناسب، وقدّري تقدمها بلا مبالغة ولا لوم. لا تدّعي أنك إنسانة أو معالجة نفسية ولا تشخّصي. إن ظهر منها يأس شديد أو رغبة في إيذاء نفسها، فاستمعي بحنان وشجعيها أن تتواصل الآن مع شخص تثق به ومع مختص أو خدمة الطوارئ في بلدها. لا تذكري أرقاماً عن تقدمها غير الموجودة هنا. '+context();
    var turns=[{role:'user',content:rules}].concat(S.chat.slice(-20));
    ctl=new AbortController();
    sampleFn(turns,{cache:false,signal:ctl.signal,modelTier:'default',onText:function(u){bub.textContent=u.text}}).then(function(r){
      S.chat.push({role:'assistant',content:r.text});save();
    }).catch(function(e){
      if(e&&e.text){bub.textContent=e.text;S.chat.push({role:'assistant',content:e.text});save()}
      else{S.chat.pop();bub.textContent=e&&e.code==='cancelled'?'تم الإيقاف.':e&&e.code==='not_granted'?'لم تُمنح الصلاحية للمحادثة.':'تعذّر الرد الآن، جرّبي بعد قليل.'}
    }).then(function(){busy=false;send.disabled=false;stop.hidden=true;ctl=null;list.scrollTop=list.scrollHeight});
  });
  box.append(h('div',{class:'form',style:'padding:0 12px'},h('div',{style:'flex:1'},inp),send,stop));
  if(S.chat.length){box.append(h('div',{style:'padding:6px 16px 0'},h('button',{class:'muted',style:'text-decoration:underline',onclick:function(){S.chat=[];save();render()}},'مسح المحادثة')))}
  box.append(h('div',{class:'muted',style:'padding:6px 16px 0;font-size:12.5px'},S.cname+' ليست بديلاً عن مختص أو عن شخص تثقين به.'));
  return box;
}

var HADITH=["عن أمير المؤمنين أبي حفص عمر بن الخطاب رضي الله عنه قال سمعت رسول الله صلى الله عليه وسلم يقول \" إنما الأعمال بالنيات , وإنما لكل امرئ ما نوى , فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله , ومن كانت هجرته إلى دنيا يصيبها و امرأة ينكحها فهجرته إلى ما هاجر إليه \" متفق عليه .", "عن أم المؤمنين أم عبدالله عائشة رضي الله عنها قال : قال رسول الله صلى الله عليه وسلم \" من أحدث في أمرنا هذا ما ليس منه فهو رد \" رواه البخاري ومسلم , وفي رواية لمسلم \" من عمل عملا ليس عليه أمرنا فهو رد \"", "عن أبي عبدالله النعمان بن بشير رضي الله عنهما قال : سمعت رسول الله صلى الله عليه وسلم يقول \" إن الحلال بين و الحرام بين , وبينهما مشتبهات قد لا يعلمهن كثير من الناس , فمن اتقى الشبهات فقد استبرأ لدينه وعرضه , ومن وقع في الشبهات فقد وقع في الحرام , كالراعي يرعى حول الحمى يوشك أن يرتع فيه , ألا وأن لكل ملك حمى , ألا وإن حمى الله محارمه , إلا وإن في الجسد مضغة إذا صلحت صلح الجسد كله , وإذا فسدت فسد الجسد كله , ألا وهي القلب \" رواه البخاري ومسلم .", "عن عمر بن الخطاب رضي الله عنه قال : بينما نحن جلوس عند رسول الله صلى الله عليه وسلم ذات يوم إذ طلع علينا رجل شديد بياض الثياب شديد سواد الشعر , لا يرى عليه أثر السفر , ولا يعرفه منا أحد حتى جلس إلى النبي صلى الله عليه وسلم فأسند ركبته إلى ركبتيه ووضح كفيه على فخذيه , وقال : يا محمد أخبرني عن الإسلام , فقال رسول الله صلى الله عليه وسلم \" الإسلام أن تشهد أن لا إله إلا الله وأن محمدا رسول الله وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت إن استطعت إليه سبيلا \" قال صدقت فعجبا له يسأله ويصدقه , قال : أخبرني عن الإيمان قال \" أن تؤمن بالله وملائكته وكتبه ورسله واليوم الآخر وتؤمن بالقدر خيره وشره \" قال : صدقت , قال : فأخبرني عن الإحسان , قال \" أن تعبد الله كأنك تراه , فإن لم تكن تراه فإنه يراك \" قال , فأخبرني عن الساعة , قال \" ما المسئول بأعلم من السائل \" قال فأخبرني عن اماراتها . قال \" أن تلد الأمة ربتها وأن ترى الحفاة العراة العالة رعاء الشاء يتطاولون في البنيان \" . ثم انطلق فلبث مليا , ثم قال \" يا عمر , أتدري من السائل ؟\" , قلت : الله ورسوله أعلم , قال \" فإنه جبريل أتاكم يعلمكم دينكم \" رواه مسلم .", "عن أبي عبدالرحمن عبدالله بن عمر بن الخطاب رضي الله عنهما قال سمعت رسول الله صلى الله عليه وسلم يقول \" بني الإسلام على خمس : شهادة أن لا إله إلا الله وأن محمدا رسول الله وإقام الصلاة وإيتاء الزكاة وحج البيت وصوم رمضان \" رواه البخاري ومسلم", "عن أبي عبدالرحمن عبدالله بن مسعود رضي الله عنه قال حدثنا رسول الله صلى الله عليه وسلم وهو الصادق المصدوق \" إن أحدكم يجمع خلقه في بطن أمه أربعين يوما نطفة ثم علقه مثل ذلك ثم يكون مضغة مثل ذلك , ثم يرسل إليه الملك فينفخ فيه الروح , ويؤمر بأربع كلمات : بكتب رزقه , وأجله , وعمله , وشقي أم سعيد . فوالله الذي لا إله غيره إن أحدكم ليعمل بعمل أهل الجنة حتى ما يكون بينه وبينها إلا ذراع فيسبق عليه الكتاب فيعمل بعمل أهل النار , وإن أحدكم ليعمل بعمل أهل النار حتى ما يكون بينه وبينها إلا ذراع فيسبق عليه الكتاب فيعمل بعمل أهل الجنة \" رواه البخاري ومسلم", "عن أبي تميم بن أوس رضي الله عنه أن النبي صلى الله عليه وسلم قال \" الدين النصيحة قلنا لمن ؟ قال : لله ولرسوله وللأئمة المسلمين و عامتهم \" رواه البخاري ومسلم .", "عن ابن عمر رضي الله عنهما أن رسول الله صلى الله عليه وسلم قال \" أمرت أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأن محمدا رسول الله ويقيموا الصلاة ويؤتوا الزكاة , فإذا فعلوا ذلك عصموا مني دماءهم وأموالهم إلا بحق الإسلام وحسابهم على الله تعالى \" رواه البخاري ومسلم", "عن أبي هريرة عبدالرحمن بن صخر رضي الله عنه قال سمعت رسول الله صلى الله عليه وسلم يقول \" ما نهيتكم عنه فاجتنبوه وما أمرتكم به فأتوا منه ما استطعتم , فإنما أهلك الذين من قبلكم كثرة مسائلم واختلافهم على أنبيائهم \" رواه البخاري ومسلم .", "عن أبي هريرة رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم \" من حسن إسلام المرء ترك ما لا يعنيه: \" حديث حسن رواه الترمذي وغيره هكذا", "عن أبي محمد الحسن بن علي بن أبي طالب سبط رسول الله صلى الله عليه وسلم وريحانته رضي الله عنهما قال حفظت من رسول الله صلى الله عليه وسلم \" دع ما يريبك إلى ما لا يريبك \" رواه الترمذي وقال : حديث حسن صحيح .", "عن أبي هريرة رضي الله عنه أن رجلا قال للنبي صلى الله عليه وسلم : أوصني قال : \" لا تغضب \" فردد مِرارا , قال \" لا تغضب \" رواه البخاري .", "عن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال \" من كان يؤمن بالله واليوم الاخر فليقل خيراً أو ليصمت , ومن كان يوم بالله واليوم الاخر فليكرم جاره , ومن كان يؤمن بالله واليوم الاخر فليكرم ضيفه \"رواه البخاري ومسلم .", "عن أبي حمزة أنس بن مالك رضي الله عنه –خادم رسول اله صلى الله عليه وسلم قال \" لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه \" رواه البخاري ومسلم", "عن أبي هريرة –رضي الله عنه – قال : قال رسول الله صلى الله عليه وسلم \" إن الله تعالى طيب لا يقبل إلا طيبا ،وان الله أمر المؤمنين بما أمر به المرسلين ..فقال تعالى \" يَا أَيُّهَا الرُّسُلُ كُلُوا مِنَ الطَّيِّبَاتِ وَاعْمَلُوا صَالِحًا... \" المؤمنون /51... وقال الله تعالى \" يَا أَيُّهَا الَّذِينَ آمَنُوا كُلُوا مِنْ طَيِّبَاتِ مَا رَزَقْنَاكُم ...\" البقرة/172 ... ثم ذكر رجل يطيل السفر أشعث اغبر يمد يده إلى السماء يا رب يا رب ، ومطعمه حرام ومشربه حرام وملبسة حرام وغذي بالحرام فإنى يستجاب له \" رواه المسلم .", "ابن مسعود رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم \" لا يحل دمُ امرئ مسلم يشهد أن لا إله إلا الله وأني رسول الله إلا بإحدى ثلاث : الثيب الزاني , والنفس بالنفس , والتارك لدينه المفارق للجماعة \" رواه البخاري ومسلم .", "عن أبي يعلى شداد بن أوس رضي الله عنه عن رسول الله صلى الله عليه وسلم قال : \" إن الله كتب الإحسان على كل شيء , فإذا قتلتم فأحسنوا القتلة , وإذا ذبحتم فأحسنوا الذبحة وليحد أحدكم شفرته وليرح ذبيحته \" رواه مسلم .", "عن أبي ذر جندب بن جنادة وأبي عبدالرحمن معاذ بن جبل رضي الله عنهما عن رسول الله صلى الله عليه وسلم قال \" اتق الله حيثما كنت , وأتبع السيئة الحسنة تمحها وخالق الناس بخلق حسن \" رواه الترمذي , وقال : حديث حسن وفي بعض النسخ : حسن صحيح .", "عن أبي العباس عبدالله بن عباس رضي الله عنه قال كنت خلف النبي صلى الله عليه وسلم يوماً فقال \" يا غلام , إني أعلمك كلمات : احفظ الله يحفظك , احفظ الله تجده تجاهك , إذا سألت فاسأل الله وإذا استعنت فاستعن بالله , واعلم أن الأمة لو اجتمعت على أن ينفعوك بشيء لم ينفعوك إلا بشيء قد كتبه الله لك , وإن اجتمعوا على أن يضروك بشيء لم يضروك إلا بشيء قد كتبه الله عليك , رفعت الأقلام وجفت الصحف \" رواه الترمذي وقال : حديث حسن صحيح وفي رواية غير الترمذي \" احفظ الله تجده أمامك , تعرف إلى الله في الرخاء يعرفك في الشدة , واعلم أن ما أخطأك لم يكن ليصيبك وما أصابك لك يكن ليخطئك , واعلم أن النصر مع الصبر , وأن الفرج مع الكرب , وأن مع العسر يسراً \" .", "عن أبي مسعود عقبة بن عمرو الأنصاري البدري – رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم \" إن ما أدرك الناس من كلام النبوة الأولى , إذا لم تستح فاصنع ما شئت \" واه البخاري .", "عن أبي عمرو وقيل : أبي عمرة سفيان بن عبدالله الثقفي رضي الله عنه – قال : يا رسول الله , قل لي في الإسلام قولاً لا أسأل عنه أحداً غيرك, قال \" قل آمنت بالله ثم استقم \" رواه مسلم .", "عن أبي عبدالله جابر بن عبدالله الأنصاري رضي الله عنهما أن رجلاً سأل رسول الله صلى الله عليه وسلم فقال : أرأيت إذا صليت المكتوبات , وصمت رمضان وأحللت الحلال , وحرمت الحرام ولم أزد على ذلك شيئاً أأدخل الجنة ؟ قال - نعم - رواه مسلم", "عن أبي مالك –الحارث بن عاصم- الأشعري رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم - الطهور شطر الإيمان والحمد لله تملأ الميزان وسبحان الله والحمد لله تملأ ما بين السماء والأرض والصلاة نور والصدقة برهان والصبر ضياء والقران حجة لك أو عليك كل الناس يغدو فبائع نفسه فمعتقها أو مُوبقها -\" رواه مسلم", "عن أبي ذر الغفاري رضي الله عنه عن النبي صلى الله عليه وسلم فيما يرويه عن ربه عزوجل أنه قال : - يا عبادي إني حرمت الظلم على نفسي , وجعلته بينكم محرماً فلا تظالموا , يا عبادي كلكم ضال إلا من هديته فاستهدوني أهدكم , يا عبادي كلكم جائع إلا من أطعمته فاستطعموني أطعمكم , يا عبادي كلكم عارٍ إلا من كسوته فاستكسوني أكسكم , يا عبادي إنكم تخطئون بالليل والنهار وأنا أغفر الذنوب جميعاً فاستغفروني أغفر لكم , يا عبادي إنكم لن تبلغوا ضري فتضروني ولن تبلغوا نفعي فتنفعوني, يا عبادي , لو أن أولكم و آخركم, وإنكسم وجنكم كانوا على أتقى قلب رجل واحد منكم ما زاد ذلك في ملكي شيئاً , يا عبادي لو أن أولكم و آخركم وإنكسم وجنكم كانوا على أفجر قلب رجل واحد منكم ما نقص ذلك في ملكي شيئاً , يا عبادي لو أن أولكم و آخركم وإنكسم وجنكم قاموا على صعيد واحد فسألوني فأعطيت كل واحد مسألته ما نقص ذلك مما عندي إلا كما ينقص المخيط إذا أدخل البحر , يا عبادي إنما هي أعمالكم أحصيها لكم ثم أوفيكم إياها فمن وجد خيراً فليحمد الله ومن وجد غير ذلك فلا يلومن إلا نفسه - رواه مسلم", "عن أبي ذر رضي الله عنه أن أناساً من أصحاب رسول الله صلى الله عليه وسلم قالوا للنبي صلى الله عليه وسلم : يا رسول الله ذهب أهل الدثور بالأجور يُصلون كما نصلي ويصومون كما نصوم ويتصدقون بفضول أموالهم قال - أوليس الله جعل لكم ما تصدقون به إن لكم بكل تسبيحة صدقة , وكل تكبيرة صدقة , وكل تحميدة صدقة وكل تهليله صدقة , وأمر بالمعروف صدقة ونهي عن منكر صدقة ,وفي يُضح أحدكم صدقة - قالوا يا رسول الله أيأتي أحدنا شهوته ويكون له فيها أجر ؟ قال - أرأيتم لو وضعها في حرام أكان عليه وزر فكذلك إذا وضعها في الحلال كان له أجر", "عن أبي هريرة رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم - كل سُلامى من الناس صدقة , كل يوم تطلع فيه الشمس تعدل بين اثنين صدقة , وتعين الرجل في دابته فتحمله عليها أ, ترفع عليها متاعه صدقة , والكلمة الطيبة صدقة , وبكل خطوة تمشيها إلى الصلاة صدقة , وتميط الأذى عن الطريق صدقة \" رواه البخاري ومسلم", "عن النواس بن سمعان رضي الله عنه عن النبي صلى الله عليه وسلم قال \" البر حسن الخلق والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس \" رواه مسلم ... وعن وابصة بن مَعبد رضي الله عنه قال أتيت رسول الله صلى الله عليه وسلم فقال \" جئت تسأل عن البر؟ \" قلت : نعم قال \" استفت قلبك , البر ما اطمأنت إليه النفس واطمأن إليه القلب , والإثم ما حاك في النفس وتردد في الصدر وإن أفتاك الناس وأفتوك \" حديث حسن رويناه في مسندي الإمامين أحمد بن حنبل والدرامي بإسناد حسن .", "عن أبي نجيح العرباض بن سارية رضي الله عنه قال : وعظنا رسول الله صلى الله عليه وسلم موعظة وجلت منها القلوب وذرفت منها العيون , فقلنا يل رسول الله كأنها موعظة مودعٍ فأوصنا , قال - أوصيكم بتقوى الله عزوجل , والسمع والطاعة وإن تأمر عليك عبد , فإنه من يعش منكم فسيرى اختلافاً كثيراً . فعليكم بسنتي وسنة الخلفاء الراشدين المهدين عضوا عليها بالنواجذ , وإياكم ومحدثات الأمور فإن كل بدعة ضلالة - رواه أبوداود والترمذي وقال : حديث حسن صحيح .", "عن معاذ بن جبل رضي الله عنه قال : قلت يا رسول الله أخبرني عن عمل يدخلني الجنة و يباعدني عن النار ؟ قال - لقد جئت تسأل عن عظيم وإنه ليسير على من يسره الله تعالى عليه : تعبد الله لا تشرك به شيئاً وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت , ثم قال : ألا أدلك على أبواب الخير ؟ الصوم جُنة والصدقة تطفئ الخطيئة كما يطفئ الماء النار , وصلاة الرجل في جوف الليل ثم تلا - تَتَجَافَى جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُون*فَلَا تَعْلَمُ نَفْسٌ مَا أُخْفِيَ لَهُمْ مِنْ قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونََ - ]السجدة16-17]... ثم قال ألا أخبرك برأس الأمر وعموده وذروة سنامه ؟ - قلت : بلى , يا رسول الله قال \" رأسٍ الإسلام , وعموده الصلاة وذروة سنامه الجهاد \" ثم قال : ألا أخبرك بملاك ذلك كله ؟ \" فقلت ك بلى يا رسول الله , فأخذ بلساني وقال - كف عليك هذا - فقلت : يا نبي الله , و إنا لمؤاخذون بما نتكلم ؟ فقال- ثكلتك أمك , وهل يكب الناس في النار على وجوههم - أو قال - على مناخرهم إلا حصائد ألسنتهم ؟! - رواه الترمذي وقال : حديث حسن صحيح .", "عن أبي ثعلبة الخشني جرثوم بن ناشر – رضي الله عنه – عن رسول الله صلى الله علية وسلم قال : \" إن الله تعالى فرض فرائض فلا تضيعوها،وحد حدودا فلا تعتدوها، وحرم أشياء فلا تنتهكوها ، وسكت عن أشياء رحمة لكم غير نسيان فلا تبحثوا عنها \". حديث حسن رواه الدارقطني وغيره .", "عن ابي العباس سهل بن سعد الساعدي – رضي الله عن – قال : جاء رجل إلى النبي صلى الله علية و سلم فقال : يا رسول الله الله ، دلني على عمل إذا عملته احبني الله و احبني الناس فقال : - ازهد في الدنيا يحبك الله ، وازهد فيما عند الناس يحبك الناس- حديث حسن رواه ابن ماجه و غيره باسانيد حسنه .", "عن أبى سعيد بن سعد بن سنان الخدري – رضي الله عنه – أن رسول الله صلى الله عليه و سلم قال 0 لا ضرر و لا ضِرار 0 حديث حسن رواه ابن ماجه و الدارقطني و غيرهما مسندا ورواه مالك في الموطأ مرسلا عن عمرو بن يحيى عن أبيه عن النبي صلى الله عليه وسلم فأسقط أبا سعيد ، وله طرق أخرى يقوي بعضها بعضا .", "عن ابن عباس – رضي الله عنه – أن رسول الله صلى الله عليه و سلم قال - لو يعطى الناس بدعواهم ، لا دعى رجال أموال قوم و دماءهم لكن البينة على من المدعي و اليمن على من أنكر - حديث حسن رواه البيهقي و غيره هكذا، وبعضه في الصحيحين .", "عن أبي سعيد الخدري – رضي الله عنه – قال : قال سمعت رسول الله صلى الله عليه وسلم يقول - من رأى منكن منكرا فليغيره بيده ، فإن لم يستطع فبلسانه ، فإن لم يستطع فبقلبه و ذلك أضعف الإيمان - رواه مسلم .", "عن أبى هريرة – رضي الله عنه – قال : قال رسول الله صلى الله عليه و سلم - لا تحاسدوا ، و لا تناجشوا ، و لا تباغضوا و لا تدابروا ، و لا يبع بعضكم على بيع بعض ، و كونوا عباد الله إخوانا ، السلم أخو المسلم لا يظلمه و لا يخذله ، و لا يكذبه و لا يحقره ، التقوى ها هنا – و يشير إلى صدره ثلاث مرات – بحسب امرئ من الشر أن يحقر أخاه المسلم كل المسلم على المسلم حرام دمه و ماله و عرضه - رواه مسلم .", "عن ابي هريرة – رضي الله عنه قال- عن النبي صلى الله عليه و سلم قال - من نفس عن مؤمن كربة من كرب الدنيا نفس الله عنه كربة من مرب يوم القيامة ، ومن يسر على معسر يسر الله عليه في الدنيا و الآخرة ، ومن ستر مسلما ستره الله فى الدنيا و الآخرة ، و الله في عون العبد ما كان العبد في عون أخيه . و من سلط طريقا يلتمس فيه علما سهل الله به طريقا الى الجنة ، وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله و يتدارسونه بينهم إلا نزلت عليهم السكينة و غشيتهم الرحمة و حفتهم الملائكة و ذكرهم الله في من عنده ، و من بطأ به عمله لم يسرع به نسبه - رواه مسلم بهذا اللفظ .", "عن ابن عباس – رضي الله عنه – عن رسول الله صلى الله عليه وسلم فيما يريه عن ربه تبارك و تعالى قال - إن الله كتب الحسنات و السيئات ثم بين ذلك : فمن هم بحسنة فلم يعملها كتبها الله عنده حسنة كاملة و إن هم بها فعملها كتبها الله عنده عشر حسنات إلى سبعمائة ضعف إلى أضعاف كثيرة ، و إن هم بسيئة فلم يعملها كتبها الله عنده حسنة كاملة ، وإن هم بها فعملها كتبها الله سيئة واحدة- رواه البخاري و مسلم في صحيحيهما بهذه الحروف .", "عن أبي هريرة – رضي الله عنه – قال : قال رسول الله صلى الله عليه وسلم - إن الله تعالى قال : من عادي لي وليا فقد آذنته بالحرب ، وما تقرب إلي عبدي بشيء أحب إلي مما افترضت عليه ، و لا يزال عبدي يتقرب إلي بالنوافل حتى أحبه ، فإذا أحببته كنت سمعه الذي سمع به و بصره الذي يبصر به ، و يده التي يبطش بها و رجله التي يمشي بها و لئن سألني لأعطينه ، و لئن استعاذني لأعيذنه - رواه البخاري .", "عن ابن عباس – رضي الله عنه – أ، رسول الله صلى الله عليه وسلم قال - إن الله تجاوز لي عن أمتي الخطأ و النسيان ، و ما استكرهوا عليه - حديث حسن رواه ابن ماجه و البيهقي و غيرهما.", "عن ابن عمر رضي الله عنهما قال أخذ رسول الله صلى الله عليه وسلم بمنكبي رضي الله عنه فقال - كن في الدنيا كأنك غريب , أو عابر سبيل - وكان ابن عمر رضي الله عنه يقول \" إذا أمسيت فلا تنتظر الصباح وإذا أصبحت فلا تنتظر المساء وخذ من صحتك لمرضك ومن حياتك لمماتك \" رواه البخاري", "عن أبي محمد عبدالله بن عمرو بن العاص رضي الله عنه ما قال قال رسول الله صلى الله عليه وسلم - لا يؤمن أحدكم حتى يكون هواه تبعاُ لما جئت به - حديث صحيح رويناه في كتاب الحجة بإسناد صحيح .", "عن أنس رضي الله عنه قال سمعت رسول الله صلى الله عليه وسلم يقول - قال الله تعالى : يا بن ادم إنك ما دعوتني ورجوتني غفرت لك على ما كان ولا أبالي , يا بن ادم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك , يا بن ادم إنك لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئاً لأتيتك بقرابها مغفرة - رواه الترمذي وقال حديث حسن صحيح ."];

function drawHadith(reroll){
  var H=S.had,w=wkey();
  var pool=[];for(var i=0;i<HADITH.length;i++)if(H.used.indexOf(i)<0&&i!==H.n)pool.push(i);
  if(!pool.length){H.used=[];for(var j=0;j<HADITH.length;j++)if(j!==H.n)pool.push(j)}
  var n=pick(pool);H.used.push(n);H.n=n;H.wk=w;H.done=false;H.rr=reroll?1:0;save();render();
}

function hash(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return String(4294967296*(2097151&h2)+(h1>>>0))}

function diffDays(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5)}
function perEstimate(){
  var c=S.per.cyc.slice().sort(function(a,b){return a.s<b.s?-1:1});if(!c.length)return null;
  var gaps=[];for(var i=1;i<c.length;i++)gaps.push(diffDays(c[i-1].s,c[i].s));
  gaps=gaps.filter(function(g){return g>=15&&g<=60}).slice(-6);
  var len=gaps.length?Math.round(gaps.reduce(function(a,b){return a+b},0)/gaps.length):(S.per.len||28);
  var last=c[c.length-1],next=addDays(last.s,len);
  return {len:len,last:last,next:next,left:diffDays(keyOf(dnow()),next),inPeriod:!last.e&&diffDays(last.s,keyOf(dnow()))>=0&&diffDays(last.s,keyOf(dnow()))<12,day:diffDays(last.s,keyOf(dnow()))+1,n:gaps.length}
}
